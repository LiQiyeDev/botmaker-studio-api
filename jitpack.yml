jdk:
  - openjdk21
install:
  # No -D injection and no .deps.env, unlike botmaker-session and botmaker-sdk: this module pins no BotMaker
  # upstream. Its only dependency is javafx-controls at a literal version in `provided` scope, so the
  # committed pom is already the pom a consumer resolves and there is nothing for flatten to bake in.
  - mvn install -DskipTests -Dmaven.javadoc.skip=true -B
